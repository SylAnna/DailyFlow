<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Daily Flow{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">🧠 Daily Flow</h1>
            <!-- Desktop Nav -->
            <nav class="desktop-nav">
                <a href="{% url 'home' %}" class="nav-link">Home</a>
                <a href="{% url 'todos' %}" class="nav-link">To-Do</a>
                <a href="{% url 'calendar' %}" class="nav-link">Calendar</a>
            </nav>

            <!-- Mobile Hamburger -->
            <div class="mobile-menu-btn">
                <button id="menu-btn" class="menu-button">
                    <svg class="menu-icon" fill="none" stroke="currentColor" 
                         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" 
                              stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="mobile-menu hidden">
            <a href="{% url 'home' %}" class="mobile-nav-link">Home</a>
            <a href="{% url 'todos' %}" class="mobile-nav-link">To-Do</a>
            <a href="{% url 'calendar' %}" class="mobile-nav-link">Calendar</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        &copy; 2025 Daily Flow.
    </footer>

    <script>
        const btn = document.getElementById('menu-btn');
        const menu = document.getElementById('mobile-menu');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
