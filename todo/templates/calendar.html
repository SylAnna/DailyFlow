{% extends 'template.html' %}
{% load static %}
{% block title %}Calendar{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4 text-2xl font-bold text-blue-600">Task Calendar</h2>
    <div id="calendar"></div>
</div>

<!-- FullCalendar CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>


<script id="calendar-data" type="application/json">
    [
        {% for item in tasks %}
        {
            "title": "{{ item.item|escapejs }}", 
            "start": "{{ item.date|date:'Y-m-d' }}",  
            "color": "{{ item.category.color|default:'#3B82F6' }}", 
            "category": "{{ item.category.name|escapejs }}"
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ]
</script>


<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
